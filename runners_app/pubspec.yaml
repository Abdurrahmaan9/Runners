name: runners_app
description: On-demand local errand runner for requesters and nearby runners.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2
  http: ^1.6.0
  intl: ^0.20.2
  material_ui: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
